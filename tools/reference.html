<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanto Squad Reference</title>
<!-- Generated by tools/build_reference.js from the built game: edit that and tools/reference.html, not the output. -->
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#1d1d24;--dim:#6b6b78;--line:#e4dfd4;--chip:#efeae0;--chip-on:#1d1d24;--chip-on-ink:#fff;
  --accent:#d8300c;--accent-ink:#fff;--hover:#faf8f3;--open:#fbf6ec;--good:#2c8a4b;--shadow:0 1px 2px rgba(30,25,15,.06),0 4px 14px rgba(30,25,15,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151a;--panel:#1d1e26;--ink:#ececf1;--dim:#9b9cab;--line:#2d2e3a;--chip:#272834;
  --chip-on:#ececf1;--chip-on-ink:#14151a;--accent:#ff5b38;--accent-ink:#14151a;--hover:#22232c;--open:#23242e;--good:#5fd38a;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#14151a;--panel:#1d1e26;--ink:#ececf1;--dim:#9b9cab;--line:#2d2e3a;--chip:#272834;--chip-on:#ececf1;--chip-on-ink:#14151a;
  --accent:#ff5b38;--accent-ink:#14151a;--hover:#22232c;--open:#23242e;--good:#5fd38a;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img.px{image-rendering:pixelated}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:16px}
header.top .ball{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(var(--accent-ink) 0 0) center/100% 3px no-repeat,
  radial-gradient(circle,var(--accent) 0 4px,var(--accent-ink) 4.5px 7px,transparent 7.5px),linear-gradient(transparent 50%,var(--accent-ink) 50%);
  border:3px solid var(--accent-ink);opacity:.95}
header.top h1{margin:0;font-size:22px;letter-spacing:.2px}
header.top p{margin:2px 0 0;font-size:13px;opacity:.85}
header.top .theme{margin-left:auto;background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:inherit}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:12px 14px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--dim)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button b{font-weight:500;font-size:12px;margin-left:5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--dim)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 8px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.search input:focus,.tools select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tools select{padding:8px 28px 8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:100%;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.tools select.set{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.sortbox{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px;cursor:pointer}
.btn:hover{background:var(--hover)}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:2px 0 10px}
.status a{color:var(--accent);cursor:pointer;text-decoration:underline}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:24px}
.list>.row:first-child{border-radius:14px 14px 0 0}.list>.row:last-child{border-radius:0 0 14px 14px}
.row{display:grid;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--hover)}
.row.open{background:var(--open)}
.row.head{position:sticky;top:43px;z-index:4;border-top:0;cursor:default;background:var(--panel);font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.row.head:hover{background:var(--panel)}
.row.head button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;text-align:left}
.row.head button.on{color:var(--ink)}
.row.head button.on::after{content:" ▲";font-size:10px}
.row.head button.on.desc::after{content:" ▼"}
.row + .row.head{border-top:0}
.c{min-width:0}
.c.num{font-variant-numeric:tabular-nums;text-align:right}
.row.head .c.num{text-align:right}
.name{font-weight:650;display:flex;align-items:center;gap:8px;min-width:0}
.name img.ic{width:28px;height:28px;flex:none}
.name span{overflow:hidden;text-overflow:ellipsis}
.desc{color:var(--dim);font-size:13px}
.ty{height:16px;vertical-align:middle}
.cat{height:16px;vertical-align:middle}
.tyt{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:1px 6px;border-radius:4px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--dim);margin:1px 3px 1px 0;white-space:nowrap}
.tag.good{color:var(--good)}
.dimtxt{color:var(--dim)}
.more{grid-column:1/-1;cursor:default;padding:4px 0 6px}
.more h4{margin:10px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.more p{margin:4px 0}
.mons{display:flex;flex-wrap:wrap;gap:4px}
.mon{display:inline-flex;align-items:center;gap:3px;padding:1px 8px 1px 2px;border-radius:999px;background:var(--chip);font-size:12.5px;white-space:nowrap}
.mon img{width:28px;height:28px;margin:-3px 0}
.mon em{font-style:normal;color:var(--dim);font-size:11.5px}
.mon.hid{outline:1px dashed var(--dim)}
.empty{padding:40px 16px;text-align:center;color:var(--dim)}
.legend{color:var(--dim);font-size:12.5px;margin:0 0 30px}
.legend b{color:var(--ink)}
/* columns per tab */
.list[data-tab="moves"] .row{grid-template-columns:minmax(150px,1.3fr) 82px 34px 58px 58px 40px 70px 66px minmax(220px,3fr)}
.list[data-tab="abilities"] .row{grid-template-columns:minmax(150px,1fr) 92px minmax(170px,1.3fr) minmax(240px,3fr)}
.list[data-tab="items"] .row{grid-template-columns:minmax(180px,1.2fr) 118px 120px minmax(160px,1.4fr) minmax(240px,2.6fr)}
.list[data-tab="tms"] .row{grid-template-columns:124px minmax(140px,1.3fr) 82px 34px 58px 58px 40px 86px 74px}
.lbl{display:none}
/* notes: a button on every row, the note box, the Notes list */
.notebtn{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:650;line-height:20px;cursor:pointer;white-space:nowrap}
.notebtn:hover,.notebtn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.notebtn.none{opacity:.6}.row:hover .notebtn.none,.notebtn.none:focus-visible{opacity:1}
.notebtn.draft{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.notebtn.sent{border-color:var(--accent);color:var(--accent)}
.notebtn.done{border-color:var(--good);color:var(--good)}
header.top .hbtns{margin-left:auto;display:flex;gap:8px;align-items:center}
header.top .hbtns .theme{margin-left:0;white-space:nowrap}
header.top .theme b{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:999px;background:var(--accent-ink);color:var(--accent);font-size:11.5px;text-align:center}
dialog{border:0;border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3);padding:0;width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,10,20,.5)}
.dlg{display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;max-height:calc(100vh - 48px)}
.dlg h3{margin:0;font-size:17px}
.dlg .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.dlg .now{font-size:12.5px;color:var(--dim);background:var(--chip);border-radius:10px;padding:8px 10px}
.dlg textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font:inherit;color:var(--ink)}
.dlg textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.dlg .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dlg .acts .grow{flex:1}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.main:hover{filter:brightness(1.05);background:var(--accent)}
.btn.warn{color:var(--accent)}
.state{font-size:12.5px;color:var(--dim)}
.reply{border-left:3px solid var(--good);padding:6px 10px;background:var(--chip);border-radius:0 10px 10px 0;font-size:13px}
.reply.old{border-left-color:var(--dim)}
.reply b{color:var(--good)}.reply.old b{color:var(--dim)}
.nlist{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:40px}
.nitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.nitem .t{font-weight:650}
.nitem .x{grid-column:1/-1;font-size:13px;color:var(--dim);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.nitem .x.rp{color:var(--good)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);z-index:50;max-width:calc(100vw - 32px);text-align:center}
@media (max-width:820px){
  .list .row,.list[data-tab] .row{display:flex;flex-wrap:wrap;gap:4px 12px;padding:11px 14px}
  .list .row.head{display:none}
  .row .c{flex:0 0 auto}
  .row .c.wide{flex:1 1 100%}
  .row .c.num{text-align:left}
  .lbl{display:inline;color:var(--dim);font-size:12px;margin-right:4px}
  .row .c.desc{order:9}
  .sortbox{margin-left:0}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="ball" aria-hidden="true"></div>
  <div><h1>Kanto Squad Reference</h1><p id="sub">Every move, Ability, item and TM in Pokémon Kanto Squad</p></div>
  <div class="hbtns"><button class="theme" id="notesBtn" type="button" aria-label="Notes">Notes</button><button class="theme" id="theme" type="button">Dark</button></div>
</div></header>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<main class="wrap">
  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search names and descriptions" autocomplete="off" aria-label="Search"></label>
    <div class="sortbox"><select id="sort" aria-label="Sort by"></select><button class="btn" id="dir" type="button" aria-label="Sort direction">A→Z</button></div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="status"><span id="count"></span><a id="reset" hidden>Clear filters</a></div>
  <div class="list" id="list"></div>
  <p class="legend" id="legend"></p>
</main>
<dialog id="noteDlg" aria-labelledby="noteTitle"><form method="dialog" class="dlg" id="noteForm">
  <div class="eyebrow" id="noteKind"></div><h3 id="noteTitle"></h3>
  <div class="now" id="noteNow"></div>
  <div id="noteReply"></div>
  <textarea id="noteText" placeholder="What should change? For example: make it 20% stronger, give it a burn chance, sell it at the Poké Mart..." aria-label="Your note"></textarea>
  <div class="state" id="noteState"></div>
  <div class="acts"><button class="btn warn" type="button" id="noteDel">Delete note</button><span class="grow"></span>
    <button class="btn" type="button" id="noteCancel">Cancel</button><button class="btn main" type="submit" id="noteSave">Save note</button></div>
</form></dialog>
<dialog id="notesDlg" aria-labelledby="notesTitle"><div class="dlg">
  <div class="eyebrow">Your requests</div><h3 id="notesTitle">Notes</h3>
  <p class="state" id="notesHelp"></p>
  <div class="acts"><button class="btn main" type="button" id="notesExport">Export new notes</button><button class="btn" type="button" id="notesAll">Export all</button>
    <button class="btn" type="button" id="notesDir">Choose the Notes folder</button><span class="grow"></span><button class="btn" type="button" id="notesClose">Close</button></div>
  <div class="nlist" id="notesList"></div>
  <div class="acts"><button class="btn warn" type="button" id="notesClearDone">Remove done notes</button></div>
</div></dialog>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("en-US");
const MON = D.mons, MOVE = Object.fromEntries(D.moves.map(m => [m.k, m]));
const TYPES = D.typeOrder, CATN = D.catName;
const store = { get(k) { try { return JSON.parse(localStorage.getItem("pks_ref:" + k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem("pks_ref:" + k, JSON.stringify(v)); } catch (e) {} } };

// ---------- small pieces ----------
const typeImg = t => D.types[t] ? `<img class="px ty" src="${D.types[t]}" alt="${esc(t)}" title="${esc(t)}">` : `<span class="tyt" style="background:${D.typeColor[t] || "#888"}">${esc(t)}</span>`;
const catImg = c => D.cats[c] ? `<img class="px cat" src="${D.cats[c]}" alt="${esc(CATN[c])}" title="${esc(CATN[c])}">` : esc(CATN[c]);
const monChip = (i, note, hid) => { const m = MON[i]; return `<span class="mon${hid ? " hid" : ""}" title="#${String(m.id).padStart(3, "0")} ${esc(m.n)}">${m.ic ? `<img class="px" src="${m.ic}" alt="">` : ""}${esc(m.n)}${note ? ` <em>${esc(note)}</em>` : ""}</span>`; };
const mons = (list, note, hid) => `<div class="mons">${list.slice().sort((a, b) => MON[a.i ?? a].id - MON[b.i ?? b].id).map(x => typeof x === "number" ? monChip(x, note && note(x), hid) : monChip(x.i, x.note, x.hid)).join("")}</div>`;
const pw = m => m.c === "X" ? "—" : m.range ? m.range : m.vary ? "Varies" : m.p || "—";
const acc = m => m.a ? m.a + "%" : "—";
const cdText = m => m.s === 1 ? "None" : String(m.cd);
const slotName = s => "S" + s;
const L = t => `<span class="lbl">${t}</span>`;
const monSel = () => state.mon === "" ? null : +state.mon;
// price for sorting: by currency (Poké Dollars, BP, Coins, Gems), then amount; nothing for sale last
const CUR_RANK = { "Poké Dollars": 0, BP: 1, Coins: 2, Gems: 3 };
const priceOf = it => it.price.length ? Math.min(...it.price.map(p => (CUR_RANK[p.cur] ?? 4) * 1e7 + p.v)) : Infinity;
const priceText = it => it.price.length ? it.price.map(p => `${fmt(p.v)} ${p.cur}`).filter((x, i, a) => a.indexOf(x) === i).join(" · ") : "—";
const learnHow = (m, i) => { const lv = m.lv.filter(x => x[0] === i).map(x => x[1]), tm = m.tl.includes(i); return [lv.length ? "Lv " + Math.min(...lv) : "", tm ? "TM" : ""].filter(Boolean).join(" · "); };

// ---------- notes: your requests about a move, Ability, item or TM ----------
// Kept in this browser (localStorage "pks_ref:notes") until you export them: "Export new notes" writes the new and changed ones
// as one Markdown file into the game's Notes folder (picked once; browsers that can't write to a folder download the file
// instead). Claude reads them there, does what they ask and moves each file to Notes/done with a "Done:" line under every note;
// the next tools/build_reference.js shows those replies here (D.replies).
const KIND_N = { move: "Move", ability: "Ability", item: "Item", tm: "TM" };
const TAB_KIND = { moves: "move", abilities: "ability", items: "item", tms: "tm" };
let NOTES = store.get("notes") || {};
const saveNotes = () => store.set("notes", NOTES);
const noteId = (kind, k) => kind + ":" + k;
const REPLY = D.replies || {};
// a note's state: none, draft (not exported, or changed since), sent (exported, no reply yet), done (Claude's reply to this version)
const noteState = n => !n || !n.text.trim() ? "none" : !n.x || n.x < n.t ? "draft" : REPLY[n.id] && REPLY[n.id].t === n.t ? "done" : "sent";
const NOTE_LABEL = { none: "+ Note", draft: "✎ Note", sent: "Note sent", done: "✓ Done" };
const NOTE_TIP = { none: "Write a note about this", draft: "Your note: not exported yet", sent: "Your note: exported, waiting for Claude", done: "Claude has done this note" };
const noteBtn = (kind, k) => { const id = noteId(kind, k), st = noteState(NOTES[id]);
  return `<button type="button" class="notebtn ${st}" data-note="${esc(id)}" title="${NOTE_TIP[st]}" aria-label="${NOTE_TIP[st]}">${NOTE_LABEL[st]}</button>`; };
// what the Reference shows for it now (goes into the export, so the request has its context)
function nowOf(kind, k) {
  if (kind === "move") { const m = MOVE[k]; return `${m.t} · ${CATN[m.c]} · power ${pw(m)} · accuracy ${acc(m)} · ${slotName(m.s)}, cooldown ${cdText(m)} · ${m.by.length} Pokémon learn it — ${m.d}`; }
  if (kind === "ability") { const a = D.abilities.find(x => x.k === k); return `${a.works ? "Works in battle" : "No battle effect here"} · ${a.reg.length + a.hid.length} Pokémon — ${a.d}`; }
  if (kind === "item") { const it = D.items.find(x => x.k === k); return `${it.kind}${it.tier ? ", tier " + it.tier : ""} · ${priceText(it)} · ${it.src.length ? it.src.join("; ") : "not sold or found"} — ${it.d}`; }
  const t = D.tms.find(x => String(x.id) === k), m = MOVE[t.m]; return `${t.label}: ${m.n} · ${fmt(t.price)} Poké Dollars · ${t.by.length} Pokémon can learn it — ${m.d}`;
}
function nameOf(kind, k) {
  if (kind === "move") return MOVE[k].n;
  if (kind === "ability") return D.abilities.find(x => x.k === k).n;
  if (kind === "item") return D.items.find(x => x.k === k).n;
  const t = D.tms.find(x => String(x.id) === k); return `${t.label} (${MOVE[t.m].n})`;
}
const when = ms => new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3600); }
let editing = null;
function openNote(id) {
  const [kind, ...rest] = id.split(":"), k = rest.join(":"), n = NOTES[id], st = noteState(n), r = REPLY[id];
  editing = { id, kind, k };
  $("#noteKind").textContent = KIND_N[kind] + " · note";
  $("#noteTitle").textContent = nameOf(kind, k);
  $("#noteNow").textContent = "Now: " + nowOf(kind, k);
  $("#noteText").value = n ? n.text : "";
  $("#noteReply").innerHTML = r && n && r.t === n.t ? `<div class="reply"><b>${esc(r.kind)}</b> · ${esc(r.text)}</div>`
    : r ? `<div class="reply old"><b>Reply to an earlier note</b> · ${esc(r.text)}</div>` : "";
  $("#noteState").textContent = st === "none" ? "Your note stays in this browser until you export it (Notes, at the top)."
    : st === "draft" ? `Saved ${when(n.t)} · not exported yet${n.x ? " (changed since the last export)" : ""}`
    : st === "sent" ? `Saved ${when(n.t)} · exported ${when(n.x)}, waiting for Claude` : `Saved ${when(n.t)} · done`;
  $("#noteDel").hidden = !n;
  $("#noteDlg").showModal(); $("#noteText").focus();
}
function saveNote() {
  if (!editing) return;
  const { id, kind, k } = editing, text = $("#noteText").value, old = NOTES[id];
  if (!text.trim()) { delete NOTES[id]; }
  else if (!old || old.text !== text) NOTES[id] = { id, kind, k, n: nameOf(kind, k), text, now: nowOf(kind, k), t: Date.now(), x: old ? old.x : 0 };
  saveNotes(); editing = null; renderList(); renderNotesBtn();
}
function renderNotesBtn() {
  const all = Object.values(NOTES).filter(n => n.text.trim()), fresh = all.filter(n => noteState(n) === "draft").length;
  $("#notesBtn").innerHTML = `Notes${all.length ? `<b title="${fresh} not exported">${fresh || all.length}</b>` : ""}`;
}
// the export: one Markdown file, a section per note (its id and version in a comment, so a reply can find it)
const pad2 = n => String(n).padStart(2, "0");
const stampOf = (d, sep = ":") => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}${sep}${pad2(d.getMinutes())}`;
function notesMarkdown(list, now) {
  const d = stampOf(now);
  return `# Reference notes · ${d}\n\nThe owner's requests from Pokemon Kanto Squad Reference.html (built ${D.built}), ${list.length} note${list.length > 1 ? "s" : ""}. ` +
    `"Now" is what the Reference showed when the note was written. Do each request, add a **Done:** line (or **Not done:** with why) under it, and move this file to Notes/done.\n\n` +
    list.map(n => `## ${KIND_N[n.kind]} · ${n.n}\n<!-- note: ${n.id} @${n.t} -->\n**Now:** ${n.now}\n\n${n.text.trim()}\n`).join("\n---\n\n");

// the Notes folder: a folder handle kept in IndexedDB (Chrome and Edge can write to it), else a download
const kv = (mode, fn) => new Promise((res, rej) => { const o = indexedDB.open("pks_ref", 1); o.onupgradeneeded = () => o.result.createObjectStore("kv");
  o.onsuccess = () => { try { const tx = o.result.transaction("kv", mode), q = fn(tx.objectStore("kv")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); } catch (e) { rej(e); } }; o.onerror = () => rej(o.error); });

const canFolder = () => typeof window.showDirectoryPicker === "function";
async function pickFolder() {

  await kvSet("notesDir", dir);
  if (dir.name.toLowerCase() !== "notes") toast(`Notes go to the folder "${dir.name}" (the one Claude reads is "Notes", next to the game)`);
  return dir;
}
async function notesFolder() {
  let dir = await kvGet("notesDir");

}
function download(name, text) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" })); a.download = name;

}
async function exportNotes(all) {
  const list = Object.values(NOTES).filter(n => n.text.trim() && (all || noteState(n) === "draft"));
  if (!list.length) { toast(all ? "No notes to export" : "No new notes to export (Export all sends every note again)"); return; }
  const now = new Date(), name = `notes ${stampOf(now, "")}.md`, text = notesMarkdown(list, now);
  let where = null;
  if (canFolder()) {
    try { const dir = await notesFolder(), fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(text); await w.close(); where = `${dir.name}/${name}`; }
    catch (e) { if (e && e.name === "AbortError") return; console.warn(e); }
  }
  if (!where) { download(name, text); where = `your downloads as "${name}": move it into the Notes folder next to the game`; }

      <span class="x">${esc(STATE_N[st])} · ${esc(n.text.trim())}</span>${st === "done" ? `<span class="x rp">${esc(r.text)}</span>` : ""}</div>`; }).join("")

  const S = T.sorts.find(s => s[0] === curSort()) || T.sorts[0], d = curDir();

$("#sort").addEventListener("change", e => { state.sort[state.tab] = e.target.value; state.dir[state.tab] = 1; renderTools(); renderList(); save(); });
$("#dir").addEventListener("click", () => { state.dir[state.tab] = -curDir(); renderTools(); renderList(); save(); });
let qT; $("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; renderList(); save(); }, 120); });
const clear = () => { state.q = ""; state.mon = ""; state.f[state.tab] = {}; renderTools(); renderList(); save(); };
$("#reset").addEventListener("click", clear);
$("#list").addEventListener("click", e => {
  if (e.target.closest("[data-reset]")) { e.preventDefault(); clear(); return; }
  const nb = e.target.closest("[data-note]"); if (nb) { openNote(nb.dataset.note); return; }
  const h = e.target.closest("[data-sort]");
  if (h) { const s = h.dataset.sort; if (curSort() === s) state.dir[state.tab] = -curDir(); else { state.sort[state.tab] = s; state.dir[state.tab] = 1; } renderTools(); renderList(); save(); return; }
  if (e.target.closest(".more")) return;
  const r = e.target.closest(".row[data-k]"); if (!r) return;
  const id = state.tab + ":" + r.dataset.k; open.has(id) ? open.delete(id) : open.add(id); renderList();
});
$("#list").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".row[data-k]")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
// light / dark
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; $("#theme").textContent = dark ? "Light" : "Dark"; };
applyTheme(store.get("theme"));
$("#theme").addEventListener("click", () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; store.set("theme", t); applyTheme(t); });
// notes
$("#noteForm").addEventListener("submit", () => saveNote());
$("#noteText").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveNote(); $("#noteDlg").close(); } });
$("#noteCancel").addEventListener("click", () => { editing = null; $("#noteDlg").close(); });
$("#noteDel").addEventListener("click", () => { if (!editing || !confirm("Delete this note?")) return; delete NOTES[editing.id]; saveNotes(); editing = null; $("#noteDlg").close(); renderList(); renderNotesBtn(); renderNotes(); });
$("#noteDlg").addEventListener("close", () => { editing = null; if ($("#notesDlg").open) renderNotes(); });
$("#notesBtn").addEventListener("click", () => { renderNotes(); $("#notesDlg").showModal(); });
$("#notesClose").addEventListener("click", () => $("#notesDlg").close());
$("#notesExport").addEventListener("click", () => exportNotes(false));
$("#notesAll").addEventListener("click", () => exportNotes(true));
$("#notesDir").addEventListener("click", async () => { try { const d = await pickFolder(); toast(`Notes folder: ${d.name}`); } catch (e) {} });
$("#notesList").addEventListener("click", e => { const b = e.target.closest("[data-note]"); if (b) openNote(b.dataset.note); });
$("#notesClearDone").addEventListener("click", () => { for (const n of Object.values(NOTES)) if (noteState(n) === "done") delete NOTES[n.id]; saveNotes(); renderNotes(); renderList(); renderNotesBtn(); });
window.addEventListener("storage", e => { if (e.key === "pks_ref:notes") { NOTES = store.get("notes") || {}; renderList(); renderNotesBtn(); } });
renderNotesBtn();
$("#sub").textContent = `Every move, Ability, item and TM in Pokémon Kanto Squad · built ${D.built}`;
render();
</script>
</body>
</html>
