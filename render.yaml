# Render (https://render.com) runs the online battle server from this file: New > Blueprint, pick this repo. Free plan: it sleeps
# after 15 minutes without players and takes about a minute to wake up for the first one.
services:
  - type: web
    name: pokesquad-battler
    runtime: node
    rootDir: server
    plan: free
    buildCommand: echo "no packages"
    startCommand: node server.js
    healthCheckPath: /
