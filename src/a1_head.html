<title>Pokémon Kanto Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&family=Pixelify+Sans:wght@500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen phone app. Trainer and money on top, a scrolling view in the middle, five tabs at the bottom;
   battles open full screen. Look: bright and rounded, Poké Ball red and white, like the handheld menus. */
:root{
  --bg:#eef2f8; --card:#ffffff; --card2:#f5f7fb; --card3:#e8edf5; --line:#d8deea; --line2:#c2cadb;
  --text:#1f2633; --dim:#5d6678; --faint:#8a93a6;
  --red:#e3350d; --red2:#b8280a; --blue:#3b7dd8; --blue2:#2a5aa8; --gold:#f2b63a; --good:#2a9a5a; --bad:#d8402e;
  --f-title:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
  --f-body:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  --f-display:var(--f-title);
  --r:16px;
  --f-pixel:"Pixelify Sans","Press Start 2P","Courier New",monospace;
  --f-8bit:"Press Start 2P","Pixelify Sans","Courier New",monospace;
  /* inside the Game Boy screen the phone's safe areas are handled by the shell */
  --sat:0px; --sab:0px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#16161c}
body{height:100%;margin:0;background:#16161c;color:var(--text);font:15px/1.35 var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
img.px,.px img,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- app shell ---------- */
#app{height:100%;width:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);position:relative;
  background:radial-gradient(circle at 100% 0,#ffffff 0,transparent 40%),
    radial-gradient(circle at 92% 30%,transparent 46px,#e3350d0d 47px 49px,transparent 50px),
    radial-gradient(circle at 6% 70%,transparent 60px,#3b7dd80d 61px 63px,transparent 64px),var(--bg)}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#f0442a,var(--red));color:#fff;
  box-shadow:0 3px 0 #9a2208,0 6px 14px #0002;padding-top:calc(8px + var(--sat));position:relative;z-index:2}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.me-av{width:36px;height:36px;flex:none;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 2px #9a2208;overflow:hidden;display:grid;place-items:center}
.me-av img{width:44px;height:44px;object-fit:cover;object-position:50% 10%}
.me-av img.mug,.cav img.mug{width:100%;height:100%;object-fit:cover;transform:none}   /* a close-up of the head (mugURL) */
.me-name{font:700 14px var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-name .num{font:800 11px var(--f-body);opacity:.85}
.me-xp{height:4px;background:#ffffff44;margin-top:3px;width:80px;max-width:100%;border-radius:2px;overflow:hidden}
.me-xp i{display:block;height:100%;background:#fff}
.res{display:flex;gap:5px;flex:none}
.pill{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 3px;background:#fff;color:var(--text);border-radius:999px;font:800 12.5px var(--f-body);
  font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 -2px 0 #0001}
.pill svg{width:18px;height:18px;flex:none}
.pill small{font:600 10px var(--f-body);color:var(--dim)}
#view{overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px #0000000d;padding-bottom:var(--sab)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;color:var(--faint);font:700 11px var(--f-title);position:relative;white-space:nowrap}
#tabs button svg{width:24px;height:24px}
#tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#tabs button.on{color:var(--red)}
#tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* ---------- text ---------- */
h1,h2,h3{margin:0;font-family:var(--f-title);font-weight:700;line-height:1.1;text-wrap:balance}
h1{font-size:28px} h2{font-size:21px} h3{font-size:16px}
.eyebrow{font:800 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.good{color:var(--good)} .bad{color:var(--bad)} .gold{color:#b8860b}
p{margin:0}

/* ---------- surfaces ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 0 #00000008,0 4px 16px #1f26330d;border:1px solid var(--line)}
.sub{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.divider{height:1px;background:var(--line);margin:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border:2px solid var(--line);border-radius:999px;font:700 12.5px var(--f-title);color:var(--dim);background:#fff}
.chip[style*="--tc"]{border-color:color-mix(in srgb,var(--tc) 50%,#fff)}
.chip.on{color:#fff;background:var(--red);border-color:var(--red)}
.chip.on[style*="--tc"]{background:var(--tc);border-color:var(--tc)}
.chip:disabled{opacity:.4}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font:800 11px var(--f-body);background:var(--card3);color:var(--dim)}
.ty{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font:700 11.5px var(--f-title);color:#fff;background:var(--tc);text-shadow:0 1px 1px #0005;box-shadow:inset 0 -2px 0 #0002;white-space:nowrap}
.tyi{height:16px;width:auto;flex:none;vertical-align:middle;image-rendering:pixelated}
.tyic{width:20px;height:20px;flex:none;vertical-align:middle;image-rendering:pixelated}
/* type matchups: rows of square icons */
.matchups{display:grid;gap:5px;margin-top:6px}
.matchups .murow{display:grid;grid-template-columns:5.6em 1fr;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.matchups .tyics{display:flex;flex-wrap:wrap;gap:4px}
.matchups .tyicw{position:relative;display:inline-flex}.matchups .tyic{width:24px;height:24px}
.matchups .tyicw i{position:absolute;right:-5px;bottom:-5px;font:800 9px/1 var(--f-body);font-style:normal;color:#fff;background:#1f2633;border-radius:6px;padding:1px 3px}
/* the type filter: one row of icons */
.filters.tyfs{flex-wrap:wrap;overflow:visible}
.filters .chip.tyf{padding:2px;border-radius:7px;line-height:0;opacity:.5}.filters .chip.tyf.on{opacity:1;background:#fff;border-color:var(--tc);box-shadow:0 0 0 2px var(--tc)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:3px}   /* (every choice in view: a row wraps instead of running off the screen) */
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.tabs2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card3);border-radius:999px;padding:3px;gap:2px}
.tabs2 button{padding:8px 4px;font:700 13px var(--f-title);color:var(--dim);border-radius:999px;white-space:nowrap}
.tabs2 button.on{background:#fff;color:var(--red);box-shadow:0 2px 6px #0002}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:999px;
  font:700 16px var(--f-title);color:#fff;background:linear-gradient(180deg,#f2563a,var(--red));box-shadow:0 3px 0 var(--red2),0 6px 12px #e3350d33;transition:transform .08s,filter .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2)}
.btn.blue{background:linear-gradient(180deg,#5a96e8,var(--blue));box-shadow:0 3px 0 var(--blue2),0 6px 12px #3b7dd833}
.btn.ghost{color:var(--text);background:#fff;box-shadow:0 2px 0 var(--line2),inset 0 0 0 2px var(--line)}
.btn.red{background:linear-gradient(180deg,#f06a5a,var(--bad));box-shadow:0 3px 0 #8a2018}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(1);opacity:.5;pointer-events:none}
.cost{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:800}
.cost svg{width:16px;height:16px}
.btn .cost{font-family:var(--f-body)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:12px;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 3px 0 var(--line),0 6px 14px #1f26330d}
.tile h3{font-size:17px;padding-right:34px}
.tile .tsub{font-size:12px;color:var(--dim)}
.tile .ticon{position:absolute;right:10px;top:10px;width:40px;height:40px}
.tile .ticon svg{width:100%;height:100%}
.tile:disabled{opacity:.5}
/* half-width tiles: the corner icon takes its own room at the top, so long lines (the Battle Stadium's) never run under it */
.tiles .tile:not(.shopit) > .ticon{position:static;flex:none;align-self:flex-end;margin:-4px -2px auto 0}
.tiles .tile:not(.shopit) > h3{padding-right:0}
.tile .ticon.tr{width:46px;height:46px}.tile .ticon.tr img{width:100%;height:100%;object-fit:contain;object-position:bottom}
/* shop cards: the item's icon sits beside its name, so long descriptions never run under it; prices line up at the bottom */
.tile.shopit{justify-content:flex-start;gap:4px}
.shopit .shophd{display:flex;align-items:center;gap:8px;min-height:38px}
.shopit .shophd .ticon{position:static;flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center}
.shopit .shophd h3{font-size:15px;line-height:1.15;padding-right:0;min-width:0;overflow-wrap:anywhere}
.shopit .tsub.cost{margin-top:auto;padding-top:2px}
.tile.ls-t{background:linear-gradient(140deg,#ffe8e2,#fff 70%)}
.tile.ds-t{background:linear-gradient(140deg,#e2ecff,#fff 70%)}
.tile.wide{grid-column:1/-1;min-height:74px}
.tile.chap,.tile.hunt{min-height:92px;background:linear-gradient(115deg,color-mix(in srgb,var(--cc) 30%,#fff),#fff 70%);padding-right:84px}
.tile .chtr{position:absolute;right:6px;bottom:0;height:86px;width:86px;object-fit:contain;object-position:bottom}
.tile.soon{background:repeating-linear-gradient(135deg,#0000 0 10px,#00000008 10px 20px),var(--panel);border-style:dashed}
.tile.soon h3,.tile.soon .eyebrow{color:var(--cc)}
.tile.wide.soon,.tile.wide.rgn{padding-right:92px}.tile.rgn h3,.tile.rgn .eyebrow{color:var(--cc)}
.soonrow{display:flex;gap:1px;margin-top:4px;flex-wrap:wrap}.soonrow img{width:27px;height:27px;object-fit:contain;object-position:bottom}
.soonrow:not(.big){flex-wrap:nowrap}.soonrow:not(.big) img{flex:1 1 0;min-width:0;max-width:27px}
.soonrow.big{gap:8px}.soonrow.big>span{display:flex;flex-direction:column;align-items:center}.soonrow.big img{width:56px;height:56px}
.soongyms{display:grid;grid-template-columns:1fr 1fr;gap:6px}.soongyms>div{display:flex;gap:6px;align-items:center}
.soongyms img{width:44px;height:44px;object-fit:contain;flex:none}.soongyms>div>span{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
/* chapter and Explore backgrounds (the FireRed/LeafGreen area previews): on the right of the card, the picture itself fading
   into the card towards the left, so there's no edge at any width */
.tile.chap.hasbg,.tile.hunt.hasbg{isolation:isolate}
.tile.chap.hasbg::before,.tile.hunt.hasbg::before{content:"";position:absolute;top:0;right:0;bottom:0;aspect-ratio:240/112;max-width:100%;z-index:-1;border-radius:inherit;
  background:var(--bg) right center/cover no-repeat;image-rendering:pixelated;-webkit-mask-image:linear-gradient(90deg,#0000,#000 65%);mask-image:linear-gradient(90deg,#0000,#000 65%)}
.tile.chap.hasbg > :is(.eyebrow,h3,.tsub),.tile.hunt.hasbg > :is(.eyebrow,h3,.tsub){text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 10px #fff}
.tile.chap.hasbg .chtr,.tile.hunt.hasbg .ticon img{filter:drop-shadow(0 2px 3px #0006)}
/* Safari Zone areas: their Pokémon stand in the FireRed/LeafGreen Safari Zone, which fades out under the text */
.banner-card.safari.hasbg{background:linear-gradient(180deg,#fff0 0,#fff0 96px,#fffcefe0 146px,#fffcef 190px),var(--bg) center top/100% auto no-repeat,#fffcef;image-rendering:pixelated}
.banner-card.safari.hasbg.tall .bcrowd{top:66px}
/* an Explore area's picture above its details */
.areapic{aspect-ratio:240/112;border-radius:14px;background:var(--bg) center/cover no-repeat;image-rendering:pixelated;box-shadow:0 2px 8px #0002}
/* and across the top of the chapter's map, fading into the map's colour */
.mapwrap .mapbg{position:absolute;left:0;right:0;top:0;aspect-ratio:240/112;background:var(--bg) center/cover no-repeat;image-rendering:pixelated;
  -webkit-mask-image:linear-gradient(180deg,#000 55%,#0000);mask-image:linear-gradient(180deg,#000 55%,#0000);pointer-events:none}
.mapwrap svg.map{position:relative}
.tile.shopit{min-height:118px}
.tile.shopit .ticon{width:44px;height:44px}
.hint{color:var(--text);text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff8e6;border:2px solid #f2d68a}
.hint svg{flex:none}

/* ---------- portraits ---------- */
.pt{position:relative;width:var(--s,72px);flex:none;text-align:center}
.pt .ring{position:relative;width:100%;aspect-ratio:1;border-radius:50%;padding:4px;
  background:radial-gradient(circle at 50% 70%,#fff 0 40%,transparent 41%),linear-gradient(135deg,color-mix(in srgb,var(--gc) 55%,#fff),color-mix(in srgb,var(--gc2) 55%,#fff));
  box-shadow:inset 0 0 0 3px #fff,0 0 0 2px color-mix(in srgb,var(--gc) 70%,#fff),0 3px 6px #0002}
.pt .ring img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.pt .lv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);min-width:24px;padding:0 5px;height:18px;border-radius:9px;
  background:#fff;border:2px solid var(--gc);font:800 11px/14px var(--f-body);color:var(--text)}
.pt.locked .ring{filter:grayscale(1) opacity(.5)}
.pt .potb{position:absolute;right:-4px;top:14px;font:900 9px var(--f-body);color:#fff;background:#7a4ad8;border-radius:5px;padding:1px 3px;z-index:2}
.pt .heldb{position:absolute;left:-3px;top:14px;width:18px;height:18px;z-index:2;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0003}
.pt .heldb svg{width:100%;height:100%}
.rstars{display:flex;justify-content:center;gap:0;height:12px;margin-bottom:2px}
.rstars svg{width:12px;height:12px}
.pname{margin-top:9px;font:700 12.5px/1.1 var(--f-title);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pname .sty{display:flex;justify-content:center;gap:3px;margin-top:3px}
.pname .sty i{width:14px;height:5px;border-radius:3px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 8px}
.rcell{display:flex;flex-direction:column;align-items:center;padding:6px 2px 6px;border-radius:14px;min-width:0}
.rcell .pt{--s:70px}
.rcell .pw{font:700 11px var(--f-body);color:var(--dim);font-variant-numeric:tabular-nums}
.rcell.ready{background:radial-gradient(60% 50% at 50% 35%,#ffe9a0,transparent)}
.rcell.adv .ring{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #f2b63a,0 0 12px #f2b63a}
.rcell.sel{background:#ffe8e2;box-shadow:inset 0 0 0 2px var(--red)}

/* ---------- summary ---------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.statgrid div{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.statgrid span{color:var(--dim)}
.statgrid b{font-variant-numeric:tabular-nums}
.statgrid .nup span,.statgrid .nup b{color:#ff8a5a}.statgrid .ndn span,.statgrid .ndn b{color:#6aa8ff}
.shopsec{margin:6px 0 -4px}
.sbar{display:grid;grid-template-columns:34px 34px 1fr;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.sbar span{color:var(--dim);font-weight:800} .sbar b{text-align:right}
.sbar i{height:8px;background:var(--card3);border-radius:4px;overflow:hidden} .sbar em{display:block;height:100%;border-radius:4px}
.ab{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.abicon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;font:700 14px var(--f-title);color:#fff;background:var(--tc);box-shadow:inset 0 -3px 0 #0002;text-shadow:0 1px 1px #0005}
.abicon.empty{background:none;color:var(--dim);border:2px dashed var(--line2);box-shadow:none;text-shadow:none}
.abicon.sm{width:34px;height:34px;border-radius:10px;font-size:12px;flex:none}
/* moves: the level-up list, "wants to learn", the TM counter */
.lset summary{cursor:pointer;font:700 13px var(--f-title);padding:4px 0}
.lsrows{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.lsrow{display:grid;grid-template-columns:52px 1fr auto 26px;align-items:center;gap:6px;padding:3px 6px;border-radius:8px;font-size:12.5px}
.lsrow.on{background:#3ddc8422} .lsrow.later{opacity:.55} .lsrow .tyi{height:14px}
.mvcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mvc{display:flex;flex-direction:column;gap:3px;padding:8px;border:2px solid var(--line);border-radius:12px;min-width:0}
.mvc:first-child{border-color:var(--good)}
.tmfits{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:46cqh;overflow:auto}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:6px;background:var(--card3);border-radius:3px}
.pips i.on{background:var(--red)}
.bar{height:9px;background:var(--card3);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#8ae8b0);border-radius:5px}
.opcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 22%,#fff),#fff 60%,color-mix(in srgb,var(--tc2) 18%,#fff))}
.opcard .opart{width:136px;height:136px;border-radius:50%;background:radial-gradient(circle at 50% 75%,#fff 0 45%,color-mix(in srgb,var(--tc) 30%,#fff) 46%);display:grid;place-items:center;box-shadow:inset 0 0 0 4px #fff,0 0 0 2px color-mix(in srgb,var(--tc) 60%,#fff)}
.opcard .opart img{width:124px;height:124px;object-fit:contain}
.opcard .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.evoline{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.evoline button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:12px;min-width:60px}
.evoline button.cur{background:#ffe8e2;box-shadow:inset 0 0 0 2px var(--red)}
.evoline button.unowned .pt{filter:grayscale(.8) opacity(.6)}
.evorow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card2);border:1px solid var(--line);border-radius:14px}
.evorow > img{width:52px;height:52px;object-fit:contain}
.ri{display:grid;place-items:center;border-radius:12px;background:var(--card2);border:1px solid var(--line);flex:none}
.ri svg{width:72%;height:72%}

/* ---------- home ---------- */
.lobby{position:relative;min-height:calc(100% - 4px);display:flex;flex-direction:column;gap:12px}
.stage{position:relative;height:min(52cqh,430px);margin:-14px -16px 0;overflow:hidden;background:linear-gradient(180deg,#5aa0ea,#a8d6f6 55%,#e8f6ff)}
.stage .sky{position:absolute;inset:0;background:radial-gradient(40px 14px at 20% 22%,#fff 60%,transparent 62%),radial-gradient(60px 16px at 28% 20%,#fff 60%,transparent 62%),
  radial-gradient(50px 14px at 76% 14%,#fff 60%,transparent 62%),radial-gradient(70px 18px at 84% 12%,#fff 60%,transparent 62%);animation:drift 30s linear infinite alternate}
@keyframes drift{to{transform:translateX(30px)}}
.stage .hill{position:absolute;left:-20%;right:-20%;bottom:16%;height:40%;border-radius:50% 50% 0 0;background:#7ac25a;box-shadow:0 -20px 0 -6px #9ad87a}

.stage img.assist{position:absolute;left:56%;bottom:13%;height:62%;max-width:70%;object-fit:contain;object-position:bottom;transform-origin:50% 100%;transform:translateX(-50%);
  filter:drop-shadow(0 8px 6px #0003);animation:breathe 3.2s ease-in-out infinite;cursor:pointer}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.01,1.03)}}
/* your trainer stands on the hill just behind the partner, above its nameplate (--np: how far the nameplate reaches up) */
.stage{--np:87px}
.stage img.trainer{position:absolute;left:16%;bottom:var(--np);height:30%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 4px #0003)}
.stage img.trainer.solo{left:58%;transform:translateX(-50%);height:40%}
.stage .quip{position:absolute;left:16px;right:76px;top:14px;padding:10px 12px;background:#fff;border:3px solid #48506a;border-radius:14px;font-size:14px;animation:rise .3s ease-out;z-index:3}

.stage button.nameplate{text-align:left;color:inherit;font:inherit;cursor:pointer;z-index:2}
/* the home overworld (a9i_home.js): a FireRed/LeafGreen map with your trainer and Pokémon walking around */
.stage canvas.hworld{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.hareas{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.harea{position:relative;aspect-ratio:7/5;border-radius:12px;background:#30343c center/cover no-repeat;image-rendering:pixelated;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;display:flex;align-items:flex-end;padding:0}

.harea.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}

.hparty{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;max-height:38cqh;overflow:auto;padding:2px}
.hmon{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:10px;border:2px solid var(--line);background:#fff;font:600 10px/1.1 var(--f-body);color:var(--text)}

.hmon.on{border-color:var(--red);background:#fff1ec}

.stage .sidebtns{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:20px;z-index:2}
/* the right-hand buttons stack up from the bottom; when the scene is too short for all of them they go on in a second column to the
   left, so the top one (Events) never ends up under the header */
.stage .sidebtns:not(.left){top:10px;flex-wrap:wrap-reverse;justify-content:flex-end;align-content:flex-start;column-gap:24px}
.stage .sidebtns.left{left:10px;right:auto;top:14px;bottom:auto}
.sidebtn{position:relative;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:#fff;color:var(--red);box-shadow:0 3px 0 var(--line2),0 4px 10px #0002}
.sidebtn svg{width:26px;height:26px}
.sidebtn small{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font:700 10px var(--f-title);color:#1f2633;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
.sidebtn .dot{top:-3px;right:-3px}
.sidebtn .cnt{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--red);color:#fff;font:800 11px/19px var(--f-body);font-style:normal;text-align:center;border:2px solid #fff}
/* shorter screens: the left buttons line up along the top so they never run into the partner's nameplate; shorter still, smaller
   buttons and a nameplate without its "Partner Pokémon" line (the right-hand column wraps into a second one when it runs out of room) */
@container screen (max-height:620px){.stage .sidebtns.left{flex-direction:row;gap:12px;top:10px}}
@container screen (max-height:440px){.sidebtn{width:44px;height:44px;border-radius:14px}.sidebtn svg{width:22px;height:22px}.stage .sidebtns{gap:18px;bottom:18px}
  .stage .nameplate{bottom:8px;padding:6px 10px}.stage .nameplate .eyebrow{display:none}.stage{--np:61px}.stage img.trainer{height:26%}}
@container screen (max-height:400px) and (min-width:360px){.stage img.trainer:not(.solo){left:76%;bottom:12%;height:30%}.stage img.trainer.solo{left:62%;bottom:12%}}
@container screen (max-height:400px) and (max-width:359.9px){.sidebtn{width:38px;height:38px;border-radius:12px}.sidebtn svg{width:20px;height:20px}.stage .sidebtns{gap:14px;bottom:16px}.stage img.trainer{height:20%}.stage img.trainer.solo{left:66%;height:32%}}
.badgecase{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px;background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:inset 0 2px 6px #0000000f}

.bdg{aspect-ratio:1;display:grid;place-items:center} .bdg svg{width:86%;height:86%}
.bdg.on svg{filter:drop-shadow(0 2px 2px #0003)}
.bigbadge{width:110px;height:110px;animation:pop .5s} .bigbadge svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px #0003)}

/* ---------- journey ---------- */

.mapwrap{position:relative;margin:0 -16px;overflow:hidden}
.mapwrap svg.map{display:block;width:100%;height:auto}
.mnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}

/* ---------- team select ---------- */

  color:var(--text);font:600 13px/1.35 var(--f-body);box-shadow:0 8px 24px #0004;pointer-events:none}

.slot{display:flex;flex-direction:column;align-items:center;position:relative}
.slot .pt{--s:min(66px,18cqw)}
.slot .empty{width:min(66px,18cqw);aspect-ratio:1;border-radius:50%;border:3px dashed var(--line2);margin-top:14px}

/* ---------- modal / toast ---------- */
#modal{position:absolute;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:#1f263380;backdrop-filter:blur(2px);

.toast{padding:9px 16px;background:#fff;border:3px solid #48506a;color:var(--text);font:700 14px var(--f-body);border-radius:14px;box-shadow:0 8px 24px #0003;animation:tin .25s ease-out}

/* ---------- battle ---------- */
#battle{position:absolute;inset:0;z-index:40;background:#000;padding-top:var(--sat);padding-bottom:var(--sab)}
.bwrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:manipulation}
#bcv{position:absolute;inset:0;display:block;touch-action:none}
.btop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px 10px;pointer-events:none}

.bt-title b{font:700 14px var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.wx{width:34px;height:34px;display:grid;place-items:center;font-size:18px;background:#ffffffd9;border-radius:10px}

.bctl{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(12px + var(--sab));z-index:6;display:none;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,#1f2633f2 60%,#1f263300)}

  background:linear-gradient(180deg,#fff,#eef1f6);border:3px solid var(--tc);box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 70%,#000);color:var(--text);overflow:hidden}

/* the bench: Switch (next to "What will X do?") and the picker for who comes in */
.bswbtn{margin-left:auto;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:62px;padding:5px 8px;border-radius:12px;
  background:linear-gradient(180deg,#fff,#eef1f6);border:3px solid #e3350d;box-shadow:0 3px 0 #9a2208;color:var(--text)}

.benchgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

  border:3px solid #48506a;box-shadow:0 3px 0 #2a3040;color:var(--text);overflow:hidden;min-width:0}

@container screen (max-width:430px){.bnc{padding:5px 6px;gap:4px}.bnc img{width:30px;height:30px}.bnn b{font-size:12px}}
.bpop{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:#1f263399}
.bpopbox{width:100%;max-width:400px;max-height:90%;overflow:auto;background:#fff;border-radius:20px;padding:16px;animation:rise .2s ease-out;color:var(--text)}
.bpopbox .bpt{width:56px;height:56px;border-color:var(--line)}
.result{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px;
  background:radial-gradient(80% 60% at 50% 40%,#ffffffee,#eef2f8f5);animation:rise .3s ease-out;text-align:center;overflow:auto;color:var(--text)}

.bigstars{display:flex;gap:6px} .bigstars span{width:48px;height:48px;display:block} .bigstars svg{width:100%;height:100%}

.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
.lvups{display:flex;flex-direction:column;gap:4px;width:100%;max-width:360px}

.cutin{position:absolute;inset:0;z-index:55;pointer-events:none;overflow:hidden}

/* ---------- dialogue ---------- */
#dlg{position:absolute;inset:0;z-index:70;background:#000;display:flex;justify-content:center;padding-top:var(--sat);padding-bottom:var(--sab)}
.dwrap{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden}

.evostage.go img{filter:brightness(0) invert(1) drop-shadow(0 0 20px #fff)}
.evostage.done img{filter:none;transition:filter .5s}
.evostage.done .a{opacity:0} .evostage.done .b{opacity:1}
@keyframes evoA{0%,10%,25%,38%,50%,60%,68%,75%,81%,86%,90%,94%{opacity:1}5%,18%,32%,44%,55%,64%,72%,78%,84%,88%,92%,96%,100%{opacity:0}}
@keyframes evoB{0%,10%,25%,38%,50%,60%,68%,75%,81%,86%,90%,94%{opacity:0}5%,18%,32%,44%,55%,64%,72%,78%,84%,88%,92%,96%,100%{opacity:1}}
.evotext{position:relative;max-width:360px;padding:14px 18px;background:#fff;border:4px solid #48506a;border-radius:16px;font:700 16px/1.4 var(--f-body);color:#1f2633;text-align:center}
.starters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.starter{min-width:0}.starter .row{flex-wrap:wrap}.starter .row>*{max-width:100%}
.starter{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 22%,#fff),#fff);border:3px solid color-mix(in srgb,var(--tc) 60%,#fff);box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 60%,#fff)}
.starter>img{width:84px;height:84px;object-fit:contain}
.starter b{font:700 15px var(--f-title)}
.starter:active{transform:translateY(2px)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.avgrid button{display:flex;flex-direction:column;align-items:center;padding:4px 2px;border-radius:12px;border:2px solid var(--line);font:700 11px var(--f-title)}
.avgrid button.on{border-color:var(--red);background:#ffe8e2}
.avgrid img{width:54px;height:54px;object-fit:contain}
.shophead{display:flex;align-items:center;gap:10px}
.tile.look{align-items:center;text-align:center;gap:4px}.tile.look.on{box-shadow:inset 0 0 0 2px var(--red)}
.lookpic{height:100px;display:flex;align-items:flex-end;justify-content:center}.lookpic img{max-height:100px;max-width:100%;image-rendering:pixelated}
.shophead img{width:64px;height:64px;object-fit:contain;flex:none}
.mi img{width:40px;height:40px;object-fit:cover;object-position:50% 15%;border-radius:10px}
.avpick{display:flex;gap:10px}
.avpick button{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:14px;border:3px solid var(--line);font:700 13px var(--f-title)}
.avpick button.on{border-color:var(--red);background:#ffe8e2}
.avpick img{width:64px;height:64px;object-fit:contain}

/* ---------- bag, mail, medals, trainer card ---------- */
.baglist{display:flex;flex-direction:column;gap:6px}
.bagrow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:14px}
.bagrow .ri{width:40px;height:40px}
.mailrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--text)}
.mailrow.done{opacity:.6}
.mailrow .mt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.mailrow .mt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--red)}
.mi svg{width:26px;height:26px}
.mailrow .ms{flex:none;width:22px;display:grid;place-items:center}
.mailrow .ms svg{width:18px;height:18px}
.achrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px}
.achrow.full{border-color:#f2d68a;background:linear-gradient(90deg,#fff8e6,#fff)}
.achrow .ai{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--faint)}

.achrow .ai svg{width:24px;height:24px}
.medal{display:inline-block;flex:none;width:var(--ms);height:var(--ms);background:var(--medals) calc(var(--ms) * var(--mx) * -1) calc(var(--ms) * var(--my) * -1) / calc(var(--ms) * 8) calc(var(--ms) * 24) no-repeat;image-rendering:pixelated;vertical-align:middle}
.medal.off{filter:grayscale(1);opacity:.4}   /* (Black 2/White 2's Medals: medalHTML in a9c_meta.js) */
.pipsA{display:flex;gap:3px;flex:none}
.pipsA i{width:8px;height:8px;border-radius:50%;background:var(--card3);border:1px solid var(--line2)}
.pipsA i.on{background:var(--gold);border-color:#d89a1a}
.tinput{flex:1;min-width:0;font:700 16px var(--f-body);padding:10px 14px;background:var(--card2);color:var(--text);border:2px solid var(--line);border-radius:12px}
.tcard{background:linear-gradient(135deg,#fff,#e2ecff)}
/* the FireRed/LeafGreen Trainer Card: the kit's empty card (228 x 148 pixels) with the Trainer's details on top, in card pixels */
.tcard2{container-type:inline-size;width:100%;max-width:460px;margin:0 auto;perspective:900px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tcard2 .tc-in{position:relative;aspect-ratio:228/148;transition:transform .5s;transform-style:preserve-3d}
.tcard2 .tc-in.flip{transform:rotateY(180deg)}
.tcard2 .tc-face{position:absolute;inset:0;background:center/100% 100% no-repeat;image-rendering:pixelated;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 4px 8px #0004)}
.tcard2 .tc-back{transform:rotateY(180deg)}
.tcard2 .tct{position:absolute;font:500 calc(100cqw * 11 / 228)/1 'Pixelify Sans',var(--f-title);color:#606070;white-space:pre;letter-spacing:.02em;
  text-shadow:calc(100cqw / 228) calc(100cqw / 228) 0 #d0d0c8}
.tcard2 .tcid{text-align:center}
.tcard2 .tcb{position:absolute;display:block}.tcard2 .tcb img{width:100%;height:100%;object-fit:contain;object-position:bottom;image-rendering:pixelated}

/* ---------- title ---------- */
#title{position:absolute;inset:0;z-index:45;background:#5aa0ea;overflow:hidden;cursor:pointer;transition:opacity .45s;user-select:none;-webkit-user-select:none}
#title.out{opacity:0;pointer-events:none}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.tlogo{position:absolute;left:0;right:0;top:calc(9% + var(--sat));text-align:center;pointer-events:none}
.tlogo .tball{width:64px;height:64px;margin:0 auto -8px;animation:spin 6s linear infinite}
.tlogo .tball svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px #0004)}
@keyframes spin{to{transform:rotate(360deg)}}
.tlogo h1{font:700 clamp(54px,17cqw,96px)/1 var(--f-title);color:#ffcb05;-webkit-text-stroke:clamp(5px,1.6cqw,9px) #2a5aa8;paint-order:stroke;letter-spacing:.02em;
  text-shadow:0 6px 0 #1a3a7a;transform:rotate(-3deg)}
.tlogo .tsub{display:inline-block;margin-top:6px;padding:4px 16px;font:700 clamp(16px,5cqw,24px) var(--f-title);color:#fff;background:var(--red);border-radius:999px;border:3px solid #fff;box-shadow:0 4px 0 #9a2208}
.tload{position:absolute;left:14%;right:14%;top:50%;text-align:center;font:800 12px var(--f-body);color:#1f2633;transition:opacity .4s}
.tload.done{opacity:0}
.tbar{height:8px;border-radius:4px;background:#ffffff99;overflow:hidden;margin-bottom:6px;border:2px solid #fff}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ffcb05)}
.ttap{position:absolute;left:0;right:0;top:50%;text-align:center;font:700 22px var(--f-title);color:#fff;-webkit-text-stroke:4px #2a5aa8;paint-order:stroke;animation:tblink 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tblink{50%{opacity:.35}}
.tfoot{position:absolute;right:12px;top:calc(12px + var(--sat));display:flex;gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:60px;padding:6px 0;background:#ffffffd9;border-radius:14px;color:#1f2633;font:700 10px var(--f-title);box-shadow:0 2px 6px #0002}
.tbtn svg{width:22px;height:22px}
.tver{position:absolute;left:0;right:0;bottom:calc(8px + var(--sab));text-align:center;font:700 10.5px/1.5 var(--f-body);color:#ffffffdd;text-shadow:0 1px 2px #0006;pointer-events:none;padding:0 12px}
.tfoot.l{right:auto;left:12px}
.tbtn.demo{color:var(--red)}
.tuser{position:absolute;left:0;right:0;top:calc(50% + 36px);text-align:center;font:800 13px var(--f-body);color:#fff;text-shadow:0 1px 2px #0008;pointer-events:none}
.tpanel{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:14px;background:#0a1a3a8c;backdrop-filter:blur(3px);cursor:default;animation:tpin .25s ease-out}
@keyframes tpin{from{opacity:0}}
.tpanel .tcard{width:100%;max-width:360px;max-height:calc(100% - 16px);overflow:auto;background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px #0005;border:3px solid #ffcb05}
.tpanel .tcard h2{font:700 22px var(--f-title)}
.tclub{display:flex;align-items:center;gap:8px;font:700 13px var(--f-title);color:var(--blue2)}
.tclub svg{width:22px;height:22px}
.tabs2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:999px;background:var(--card3);padding:3px}
.tabs2 button{padding:8px 4px;font:700 13px var(--f-title);color:var(--dim);border-radius:999px}
.tabs2 button.on{background:var(--red);color:#fff}
.tfield{display:flex;flex-direction:column;gap:4px}
.tfield label{font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tfield input{font:600 16px var(--f-body);padding:10px 12px;background:var(--card2);color:var(--text);border:2px solid var(--line);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
.tfield input:focus{border-color:var(--blue)}
.terr{min-height:16px;font:700 13px var(--f-body);color:var(--bad)}
.tcheck{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim)}
.tcheck input{width:18px;height:18px;accent-color:var(--red);flex:none}
.tlink{color:var(--blue2);font:700 13px var(--f-title);padding:6px}
.tacct{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.tnote{font-size:12px;color:var(--faint);line-height:1.35}
/* servers: the title screen's server button, the server list, launch events */
.tsrv{position:absolute;left:50%;transform:translateX(-50%);top:calc(50% + 72px);display:flex;align-items:center;gap:6px;padding:6px 12px;background:#ffffffe0;border-radius:999px;font:700 12px var(--f-title);color:#1f2633;box-shadow:0 2px 6px #0003;white-space:nowrap}
.tsrv span{color:var(--blue2);margin-left:4px}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sdot.ok{background:#3cba54}.sdot.busy{background:#e8833a}
.stag{font:800 9px var(--f-title);font-style:normal;padding:1px 5px;border-radius:6px;color:#fff;background:var(--red)}
.stag.rec{background:var(--blue2)}
.srvrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.srvrow.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.srvn{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srvme{color:var(--text)}
.srvpages{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;flex:none}
.srvlist{flex:none}
.srvpages button{flex:none;padding:4px 8px;border-radius:999px;background:var(--card3);font:700 11px var(--f-title);color:var(--dim)}
.srvpages button.on{background:var(--red);color:#fff}
.ldays{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lday{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:10px;background:var(--card2);border:1px solid var(--line);text-align:left;min-height:64px;font-size:12px}
.lday.ready{border-color:#ffcb05;box-shadow:0 0 0 2px #ffcb0588}
.lday.got{opacity:.55}
.lgoal{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
/* the Event Center */
.evcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;position:relative}
.evcard .dot{position:static}
.evbar{height:6px;border-radius:999px;background:var(--card3);overflow:hidden}.evbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcb05,#f08a24)}
.calday{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.offer{display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}.offer .btn{align-self:flex-end}
.evtabs button{font-size:11.5px;padding:8px 2px}
.passrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pcell{flex:none;width:92px;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:10px;background:var(--card2);border:1px solid var(--line);opacity:.65}
.pcell.on{opacity:1;border-color:#ffcb05}
.pcell .pr{font-size:10.5px;line-height:1.25;padding:5px;border-radius:8px;background:var(--card);border:1px solid var(--line);text-align:left;min-height:36px}
.pcell .pr.prem{background:#fff6d6}.pcell .pr.plus{background:#f4e2ff}
.pcell .pr:not([disabled]){border-color:#e8833a;box-shadow:0 0 0 2px #e8833a55}
.ldays.ck{grid-template-columns:repeat(5,1fr)}.ldays.ck .lday{min-height:54px;font-size:10.5px}
.btn.sm > svg,.mbox .btn > svg,.offer .btn > svg{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.bsq{display:grid;place-items:center;height:26px;border-radius:6px;background:var(--card2);font:700 10px var(--f-title);border:1px solid var(--line)}.bsq.on{background:#ffcb05;border-color:#e8833a}
.scratch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sc{height:64px;border-radius:10px;background:linear-gradient(135deg,#c9cfdb,#9aa3b5);font:900 22px var(--f-title);color:#fff}.sc.open{background:var(--card2)}.sc svg,.sc img{width:40px;height:40px}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bx{min-height:58px;border-radius:10px;background:linear-gradient(135deg,#f4c84a,#d88a2a);font:900 20px var(--f-title);color:#fff;padding:4px}.bx.open{background:var(--card2);color:var(--text)}
.pill .plus{position:relative;display:inline-block;flex:none;width:16px;height:16px;margin-left:3px;border-radius:50%;background:#2a8a3a;color:transparent;font-size:0;overflow:hidden}
.pill .plus::before,.pill .plus::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:1px;transform:translate(-50%,-50%)}
.pill .plus::before{width:10px;height:2px}.pill .plus::after{width:2px;height:10px}
.pill .plus.on{background:#e8833a;animation:tblink 1.6s ease-in-out infinite}
.tnotes{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--dim)}
.tnotes b{color:var(--text)}
@container screen (max-height:420px){.tsrv{top:calc(44% + 74px)}.tlogo{top:4%}.tlogo h1{font-size:clamp(40px,11cqh,64px)}.tlogo .tball{width:44px;height:44px}.ttap,.tload{top:44%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}


/* ================= Game Boy shell =================
   Game Boy: a DMG-style Game Boy (screen on top, D-pad, A/B, SELECT/START below).
   Switch: a wide Game Boy Advance-style body with the controls on either side of the screen.
   Hybrid (the default) picks by the screen's shape; the setting is the device's (devicePrefs().layout).
   Colours: classic grey, Pikachu yellow, Pokémon Red, Pokémon Blue, Atomic Purple; "off" fills the window with the screen. */
.gb{--body:#cfccc4;--body2:#bab6ad;--bezel:#5d6072;--btn:#9b2a5c;--btn2:#6e1a40;--logo:#2a2f8a;--ink:#3a3d70;--dm:#c8c8d8;
  position:relative;height:100%;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:linear-gradient(90deg,var(--body2),var(--body) 6%,var(--body) 94%,var(--body2));border-radius:16px 16px 70px 16px;
  box-shadow:inset 0 -6px 0 #0002,inset 0 2px 0 #fff6}
.gb.pikachu{--body:#f6d43a;--body2:#e0b81e;--bezel:#2f56b0;--btn:#e3350d;--btn2:#9a2208;--logo:#2f56b0;--ink:#3a3a7a;--dm:#d8e4ff}
.gb.red{--body:#d8352b;--body2:#b02219;--bezel:#26262e;--btn:#1f1f26;--btn2:#000;--logo:#fff;--ink:#ffe0d8;--dm:#d8d8e0}
.gb.blue{--body:#3a6ad0;--body2:#2650a8;--bezel:#1e2438;--btn:#1f2440;--btn2:#0a0e1e;--logo:#fff;--ink:#e0e8ff;--dm:#c8d0e8}
.gb.purple{--body:#8a6ac8;--body2:#6a4aa8;--bezel:#3a2a5a;--btn:#2a1e44;--btn2:#120a22;--logo:#f2ecff;--ink:#f2ecff;--dm:#d8cff0;
  background:linear-gradient(90deg,#6a4aa8e8,#8a6ac8d8 6%,#8a6ac8d8 94%,#6a4aa8e8),repeating-linear-gradient(45deg,#ffffff10 0 3px,transparent 3px 7px)}
.gb-bezel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;padding:7px 12px 12px;background:var(--bezel);border-radius:10px 10px 40px 10px;box-shadow:inset 0 2px 6px #0006,0 1px 0 #fff4}
.gb-label{display:flex;align-items:center;gap:6px;height:12px;font:700 7.5px/1 var(--f-8bit);color:var(--dm);white-space:nowrap;overflow:hidden}
.gb-label i{flex:1;height:3px;border-top:1px solid #a8205a;border-bottom:1px solid #2a2a8a;min-width:6px}
.gb-led{display:flex;align-items:center;gap:4px;font-size:6px;opacity:.85}
.gb-led b{width:7px;height:7px;border-radius:50%;background:#ff3a3a;box-shadow:0 0 6px #ff3a3a,0 0 1px #fff inset}
#screen{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:4px;background:var(--bg);container:screen / size;box-shadow:0 0 0 2px #0005}
#screen::after{content:"";position:absolute;inset:0;z-index:200;pointer-events:none;border-radius:4px;
  background:repeating-linear-gradient(0deg,#0000000b 0 1px,transparent 1px 3px);box-shadow:inset 0 0 18px #0003}
.gb-logo{display:flex;align-items:baseline;justify-content:flex-start;gap:6px;padding:0 6px;color:var(--logo);line-height:1}
.gb-logo small{font:700 12px var(--f-title);opacity:.9}
.gb-logo b{font:700 italic 18px var(--f-title);letter-spacing:.04em}
.gb-ctl{position:relative;height:clamp(140px,22vh,200px);flex:none;--u:calc(clamp(140px,22vh,200px) / 100)}
.gb-dpad{position:absolute;left:4%;top:8%;width:calc(var(--u) * 58);height:calc(var(--u) * 58);display:grid;grid-template:1fr 1fr 1fr / 1fr 1fr 1fr;filter:drop-shadow(0 3px 0 #0004)}
.gb-dpad button,.gb-dpad i{background:#1e1e24}
.gb-dpad button[data-gb="up"]{grid-area:1/2;border-radius:4px 4px 0 0}
.gb-dpad button[data-gb="left"]{grid-area:2/1;border-radius:4px 0 0 4px}
.gb-dpad i{grid-area:2/2;background:radial-gradient(circle,#2e2e36 30%,#1e1e24 32%)}
.gb-dpad button[data-gb="right"]{grid-area:2/3;border-radius:0 4px 4px 0}
.gb-dpad button[data-gb="down"]{grid-area:3/2;border-radius:0 0 4px 4px}
.gb-dpad button.down{background:#000}
.gb-ab{position:absolute;right:3%;top:6%;display:flex;gap:calc(var(--u) * 6);transform:rotate(-25deg);transform-origin:center}
.gb-ab span{display:flex;flex-direction:column;align-items:center;gap:3px}
.gb-ab span:first-child{margin-top:calc(var(--u) * 14)}
.gb-ab button{width:calc(var(--u) * 30);height:calc(var(--u) * 30);border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--btn) 70%,#fff),var(--btn) 45%,var(--btn2));box-shadow:0 3px 0 #0005}
.gb-ab button.down,.gb-ss button.down{transform:translateY(2px);box-shadow:0 1px 0 #0005}
.gb-ab em,.gb-ss em{font:700 normal 9px var(--f-8bit);color:var(--ink)}
.gb-ss{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);display:flex;gap:calc(var(--u) * 10)}
.gb-ss span{display:flex;flex-direction:column;align-items:center;gap:4px;transform:rotate(-25deg)}
.gb-ss button{width:calc(var(--u) * 24);height:calc(var(--u) * 7);border-radius:999px;background:#7a7a86;box-shadow:inset 0 1px 0 #fff4,0 2px 0 #0004}
